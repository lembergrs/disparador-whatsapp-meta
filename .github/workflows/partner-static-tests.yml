name: Partner static tests

on:
  pull_request:
    paths:
      - 'app/Models/ParceiroApi.php'
      - 'app/Models/ParceiroFinanceiro.php'
      - 'app/Services/ParceiroFinanceiroService.php'
      - 'app/Services/FinanceiroWorkflowService.php'
      - 'app/Controllers/ParceiroAdminController.php'
      - 'app/Controllers/ParceiroCadastroController.php'
      - 'app/Core/Auth.php'
      - 'app/Controllers/ConfiguracaoController.php'
      - 'app/Models/MetaConta.php'
      - 'app/Services/ParceiroCadastroService.php'
      - 'app/Views/parceiros/**'
      - 'database/migrations/*partner*'
      - 'docs/partner-api*.md'
      - 'tests/Partner*.php'
      - '.github/workflows/partner-static-tests.yml'
  workflow_dispatch:

jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP syntax
        run: |
          php -l app/Models/ParceiroApi.php
          php -l app/Models/ParceiroFinanceiro.php
          php -l app/Services/ParceiroFinanceiroService.php
          php -l app/Services/FinanceiroWorkflowService.php
          php -l app/Services/ParceiroCadastroService.php
          php -l app/Controllers/ParceiroCadastroController.php
          php -l app/Views/parceiros/cadastro_publico.php
          php -l app/Controllers/ParceiroAdminController.php
          php -l app/Views/parceiros/detalhe.php
          php -l app/Core/Auth.php
          php -l app/Controllers/ConfiguracaoController.php
          php -l app/Models/MetaConta.php
      - name: Partner static tests
        run: |
          for test in tests/Partner*Test.php; do
            echo "Running $test"
            php "$test"
          done
