name: Partner static tests

on:
  pull_request:
    paths:
      - 'app/Models/ParceiroApi.php'
      - 'app/Models/ParceiroFinanceiro.php'
      - 'app/Services/ParceiroFinanceiroService.php'
      - 'app/Services/PartnerWebhook*.php'
      - 'app/Services/PartnerApiRateLimitService.php'
      - 'app/Services/PartnerMessageService.php'
      - 'app/Services/MetaVideoCodecValidator.php'
      - 'app/Services/MetaMediaService.php'
      - 'app/Services/TemplateMediaPreviewService.php'
      - 'app/Views/parceiros/auditoria.php'
      - 'app/Services/PartnerApiAuditService.php'
      - 'app/Models/ParceiroApiAuditoria.php'
      - 'app/Services/MetaErrorMessageService.php'
      - 'app/Controllers/DisparoController.php'
      - 'app/Controllers/CampanhaController.php'
      - 'public/assets/js/app.js'
      - 'app/Controllers/ApiV1Controller.php'
      - 'app/Services/MetaWebhookMessageIngestionService.php'
      - 'app/Services/MetaStatusWebhookService.php'
      - 'app/Services/WorkerService.php'
      - 'public/webhook/meta.php'
      - 'app/Services/FinanceiroWorkflowService.php'
      - 'app/Controllers/ParceiroAdminController.php'
      - 'app/Controllers/ParceiroCadastroController.php'
      - 'app/Core/Auth.php'
      - 'app/Controllers/ConfiguracaoController.php'
      - 'app/Models/MetaConta.php'
      - 'app/Services/ParceiroCadastroService.php'
      - 'app/Views/parceiros/**'
      - 'app/Views/conversas/**'
      - 'database/migrations/*partner*'
      - 'docs/partner-api*.md'
      - 'app/Views/site/partner_api.php'
      - 'app/Controllers/SiteController.php'
      - 'app/Models/DashboardAdmin.php'
      - 'app/Views/dashboard/index.php'
      - 'tests/Partner*.php'
      - 'app/Views/templates/index.php'
      - 'tests/TemplateCreationLoadingTest.php'
      - 'tests/TemplateSingleAccountSyncTest.php'
      - 'app/Controllers/TemplateController.php'
      - 'app/Models/Plano.php'
      - 'app/Controllers/FinanceiroAdminController.php'
      - 'tests/PlanoVisibilidadePublicaTest.php'
      - 'app/Controllers/SuporteController.php'
      - 'tests/SupportImpersonationTest.php'
      - '.github/workflows/partner-static-tests.yml'
  workflow_dispatch:

jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP syntax
        run: |
          php -l app/Services/MetaVideoCodecValidator.php
          php -l app/Services/MetaMediaService.php
          php -l app/Services/TemplateMediaPreviewService.php
          php -l app/Models/ParceiroApi.php
          php -l app/Models/ParceiroFinanceiro.php
          php -l app/Services/ParceiroFinanceiroService.php
          php -l app/Models/ParceiroWebhookEvento.php
          php -l app/Services/PartnerWebhookEventService.php
          php -l app/Services/PartnerWebhookDeliveryService.php
          php -l app/Services/PartnerApiRateLimitService.php
          php -l app/Services/PartnerMessageService.php
          php -l app/Views/parceiros/auditoria.php
          php -l app/Views/conversas/index.php
          php -l app/Views/conversas/partials/mensagens.php
          php -l app/Services/PartnerApiAuditService.php
          php -l app/Models/ParceiroApiAuditoria.php
          php -l app/Controllers/ApiV1Controller.php
          php -l app/Controllers/SiteController.php
          php -l app/Views/site/partner_api.php
          php -l app/Models/DashboardAdmin.php
          php -l app/Views/dashboard/index.php
          php -l app/Services/MetaErrorMessageService.php
          php -l app/Controllers/DisparoController.php
          php -l app/Controllers/CampanhaController.php
          php -l app/Services/MetaWebhookMessageIngestionService.php
          php -l app/Services/MetaStatusWebhookService.php
          php -l app/Services/WorkerService.php
          php -l public/webhook/meta.php
          php -l app/Controllers/ParceiroClientesController.php
          php -l app/Views/parceiros/clientes_partner.php
          php -l app/Services/FinanceiroWorkflowService.php
          php -l app/Services/ParceiroCadastroService.php
          php -l app/Controllers/ParceiroCadastroController.php
          php -l app/Views/parceiros/cadastro_publico.php
          php -l app/Controllers/ParceiroAdminController.php
          php -l app/Views/parceiros/detalhe.php
          php -l app/Controllers/SuporteController.php
          php -l tests/SupportImpersonationTest.php
          php -l app/Views/templates/index.php
          php -l tests/TemplateCreationLoadingTest.php
          php -l tests/TemplateSingleAccountSyncTest.php
          php -l app/Controllers/TemplateController.php
          php -l app/Models/Plano.php
          php -l app/Controllers/FinanceiroAdminController.php
          php -l tests/PlanoVisibilidadePublicaTest.php
          php -l app/Core/Auth.php
          php -l app/Controllers/ConfiguracaoController.php
          php -l app/Models/MetaConta.php
      - name: Partner static tests
        run: |
          for test in tests/Partner*Test.php; do
            echo "Running $test"
            php "$test"
          done
      - name: Support impersonation regression test
        run: php tests/SupportImpersonationTest.php
      - name: Template creation loading checks
        run: php tests/TemplateCreationLoadingTest.php
      - name: Template single account sync checks
        run: php tests/TemplateSingleAccountSyncTest.php
      - name: Plano public visibility checks
        run: php tests/PlanoVisibilidadePublicaTest.php
